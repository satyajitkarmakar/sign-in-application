<div class="container mt-5">
    <h2 class="mb-4">Sign In</h2>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label>Name</label>
            <input type="text" class="form-control" formControlName="name" />
            <div class="text-danger" *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid">
                <div *ngIf="userForm.get('name')?.errors?.['required']">Name is required</div>
                <div *ngIf="userForm.get('name')?.errors?.['pattern']">Name must not contain special characters</div>
            </div>
        </div>

        <div class="form-group mt-2">
            <label>Email Address</label>
            <input type="email" class="form-control" formControlName="email" />
            <div class="text-danger" *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
                <div *ngIf="userForm.get('email')?.errors?.['required']">Email is required</div>
                <div *ngIf="userForm.get('email')?.errors?.['email']">Enter a valid email</div>
            </div>
        </div>

        <div class="form-group mt-2">
            <label>Password</label>
            <input
                type="password"
                class="form-control"
                formControlName="password"
            />
            <div class="text-danger" *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid">
                <div *ngIf="userForm.get('password')?.errors?.['required']">Password is required</div>
                <div *ngIf="userForm.get('password')?.errors?.['minlength']">Password must be at least 8 characters</div>
            </div>
        </div>

        <div class="form-group mt-3">
            <label>Gender</label><br />
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="radio"
                    formControlName="gender"
                    value="Male"
                />
                Male
            </div>
            <div class="form-check form-check-inline">
                <input
                    class="form-check-input"
                    type="radio"
                    formControlName="gender"
                    value="Female"
                />
                Female
            </div>
            <div class="text-danger" *ngIf="userForm.get('gender')?.touched && userForm.get('gender')?.invalid">
                Gender is required
            </div>
        </div>

        <button class="btn btn-primary mt-3" type="submit" [disabled]="userForm.invalid">Sign In</button>
        <button
            class="btn btn-secondary mt-3 ms-2"
            type="button"
            (click)="onReset()"
        >
            Reset
        </button>
    </form>
</div>
